<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controls</title>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }

    #strip {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 72px;
      box-sizing: border-box;
      background: rgba(25, 25, 35, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      box-shadow: -4px 0 32px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
      gap: 4px;
    }

    .strip-btn {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      background: transparent;
      color: rgba(255, 255, 255, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, color 0.15s ease;
      position: relative;
      outline: none;
      flex-shrink: 0;
    }

    .strip-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: white;
    }

    .strip-btn svg {
      width: 22px;
      height: 22px;
      pointer-events: none;
    }

    .btn-active {
      background: rgba(255, 206, 7, 0.15) !important;
      color: #ffce07 !important;
    }

    .btn-active:hover {
      background: rgba(255, 206, 7, 0.22) !important;
      color: #ffce07 !important;
    }

    .btn-recording {
      background: rgba(255, 71, 87, 0.2) !important;
      color: #ff4757 !important;
    }

    .btn-recording:hover {
      background: rgba(255, 71, 87, 0.28) !important;
      color: #ff4757 !important;
    }

    @keyframes pulse-ring {
      0%   { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.55); }
      70%  { box-shadow: 0 0 0 6px rgba(255, 71, 87, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
    }

    .btn-recording {
      animation: pulse-ring 1.4s ease-out infinite;
    }

    #recTimer {
      width: 100%;
      height: 18px;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      font-family: 'SF Mono', 'Fira Mono', 'Consolas', monospace;
      color: #ff4757;
      visibility: hidden;
      line-height: 18px;
      letter-spacing: 0.02em;
      flex-shrink: 0;
    }

    #sizeBtn .size-label {
      font-size: 16px;
      font-weight: 700;
      line-height: 1;
      pointer-events: none;
    }

    /* ── Popups ── */
    .device-popup {
      position: absolute;
      top: 0;
      left: 0;
      width: 248px;   /* 320 - 72 */
      bottom: 0;
      background: rgba(20, 20, 30, 0.97);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 16px 0 0 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-right: none;
      box-shadow: -8px 0 40px rgba(0, 0, 0, 0.5);
      padding: 12px 8px;
      z-index: 9999;
      display: none;
      flex-direction: column;
      overflow-y: auto;
    }

    .device-popup.open {
      display: flex;
    }

    .device-popup::after {
      content: '';
      position: absolute;
      right: -8px;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
      border-left: 8px solid rgba(20, 20, 30, 0.97);
    }

    .popup-title {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 4px 8px 8px;
    }

    .device-item {
      width: 100%;
      text-align: left;
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.85);
      font-size: 13px;
      cursor: pointer;
      display: block;
      transition: background 0.12s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .device-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .device-item.device-selected {
      color: #ffce07;
    }
  </style>
</head>
<body>

  <!-- Camera popup -->
  <div class="device-popup" id="cameraPopup">
    <div class="popup-title">Camera</div>
    <div id="cameraList"></div>
  </div>

  <!-- Mic popup -->
  <div class="device-popup" id="micPopup">
    <div class="popup-title">Microphone</div>
    <div id="micList"></div>
  </div>

  <!-- Main strip -->
  <div id="strip">
    <button class="strip-btn" id="recordBtn" title="Record">
      <i data-lucide="circle"></i>
    </button>

    <div id="recTimer">0:00</div>

    <button class="strip-btn" id="cameraBtn" title="Camera">
      <i data-lucide="camera"></i>
    </button>

    <button class="strip-btn" id="micBtn" title="Microphone">
      <i data-lucide="mic"></i>
    </button>

    <button class="strip-btn" id="shapeBtn" title="Shape">
      <i data-lucide="circle"></i>
    </button>

    <button class="strip-btn btn-active" id="sizeBtn" title="Size">
      <span class="size-label">M</span>
    </button>

    <button class="strip-btn" id="settingsBtn" title="Settings">
      <i data-lucide="settings"></i>
    </button>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    // ── State ──────────────────────────────────────────────────────────────────
    let isRecording        = false;
    let isCameraOn         = false;
    let currentShape       = 'circle';   // 'circle' | 'square' | 'vertical'
    let currentSize        = 'M';        // 'S' | 'M' | 'L'
    let selectedCameraId   = null;
    let selectedMicId      = null;
    let recordingInterval  = null;
    let recordingStartTime = null;

    const shapeIconMap = {
      circle:   'circle',
      square:   'square',
      vertical: 'rectangle-vertical',
    };

    // ── Element refs ───────────────────────────────────────────────────────────
    const recordBtn   = document.getElementById('recordBtn');
    const recTimer    = document.getElementById('recTimer');
    const cameraBtn   = document.getElementById('cameraBtn');
    const micBtn      = document.getElementById('micBtn');
    const shapeBtn    = document.getElementById('shapeBtn');
    const sizeBtn     = document.getElementById('sizeBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const cameraPopup = document.getElementById('cameraPopup');
    const micPopup    = document.getElementById('micPopup');
    const cameraList  = document.getElementById('cameraList');
    const micList     = document.getElementById('micList');

    // ── Helpers ────────────────────────────────────────────────────────────────
    function formatTime(ms) {
      const totalSec = Math.floor(ms / 1000);
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    function reIcon(btn, iconName) {
      btn.innerHTML = `<i data-lucide="${iconName}"></i>`;
      lucide.createIcons();
    }

    // ── Popup open/close ───────────────────────────────────────────────────────
    let activePopup = null;

    function openPopup(popup, btn) {
      // Close any open popup first
      if (activePopup && activePopup !== popup) {
        activePopup.classList.remove('open');
      }
      if (popup.classList.contains('open')) {
        popup.classList.remove('open');
        activePopup = null;
        ipcRenderer.send('hide-device-popup');
        return;
      }
      // Position popup vertically aligned to button
      const rect = btn.getBoundingClientRect();
      const popupHeight = Math.min(popup.scrollHeight || 200, 400);
      // Clamp top so popup doesn't go off screen
      const winH = window.innerHeight;
      let top = rect.top;
      if (top + popupHeight > winH) top = Math.max(0, winH - popupHeight);
      popup.style.top = top + 'px';
      popup.style.bottom = 'auto';
      popup.style.height = 'auto';

      popup.classList.add('open');
      activePopup = popup;
      ipcRenderer.send('show-device-popup');
    }

    function closeAllPopups() {
      if (activePopup) {
        activePopup.classList.remove('open');
        activePopup = null;
        ipcRenderer.send('hide-device-popup');
      }
    }

    // ── Device loading ─────────────────────────────────────────────────────────
    async function loadDevices() {
      try {
        // Request permissions first so labels are populated
        await navigator.mediaDevices.getUserMedia({ audio: true, video: true })
          .catch(() => {});

        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(d => d.kind === 'videoinput');
        const audioDevices = devices.filter(d => d.kind === 'audioinput');

        // Preserve current selections if still available
        const camIds = videoDevices.map(d => d.deviceId);
        const micIds = audioDevices.map(d => d.deviceId);

        if (!selectedCameraId || !camIds.includes(selectedCameraId)) {
          selectedCameraId = videoDevices[0]?.deviceId ?? null;
        }
        if (!selectedMicId || !micIds.includes(selectedMicId)) {
          selectedMicId = audioDevices[0]?.deviceId ?? null;
        }

        renderDeviceList(cameraList, videoDevices, selectedCameraId, (id) => {
          selectedCameraId = id;
          if (isCameraOn) {
            ipcRenderer.send('start-overlay', selectedCameraId);
          }
          closeAllPopups();
        });

        renderDeviceList(micList, audioDevices, selectedMicId, (id) => {
          selectedMicId = id;
          ipcRenderer.send('start-mic', selectedMicId);
          closeAllPopups();
        });

        // Mic is always "active" once a device exists
        if (selectedMicId) {
          micBtn.classList.add('btn-active');
        }

      } catch (err) {
        console.error('loadDevices error:', err);
      }
    }

    function renderDeviceList(container, devices, selectedId, onSelect) {
      container.innerHTML = '';
      if (devices.length === 0) {
        const empty = document.createElement('div');
        empty.style.cssText = 'padding:8px 12px;font-size:13px;color:rgba(255,255,255,0.35)';
        empty.textContent = 'No devices found';
        container.appendChild(empty);
        return;
      }
      devices.forEach((device, i) => {
        const btn = document.createElement('button');
        btn.className = 'device-item' + (device.deviceId === selectedId ? ' device-selected' : '');
        btn.title = device.label || `Device ${i + 1}`;
        btn.textContent = (device.deviceId === selectedId ? '✓ ' : '') +
          (device.label || `Device ${i + 1}`);
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          onSelect(device.deviceId);
        });
        container.appendChild(btn);
      });
    }

    // ── Record ─────────────────────────────────────────────────────────────────
    function startRecording() {
      isRecording = true;
      ipcRenderer.send('start-recording');
      reIcon(recordBtn, 'square');
      recordBtn.classList.add('btn-recording');
      recTimer.style.visibility = 'visible';
      recordingStartTime = Date.now();
      recTimer.textContent = '0:00';
      recordingInterval = setInterval(() => {
        recTimer.textContent = formatTime(Date.now() - recordingStartTime);
      }, 500);
    }

    function stopRecording() {
      isRecording = false;
      ipcRenderer.send('stop-recording');
      reIcon(recordBtn, 'circle');
      recordBtn.classList.remove('btn-recording');
      recTimer.style.visibility = 'hidden';
      recTimer.textContent = '0:00';
      clearInterval(recordingInterval);
      recordingInterval = null;
      recordingStartTime = null;
    }

    recordBtn.addEventListener('click', () => {
      if (isRecording) stopRecording();
      else startRecording();
    });

    // ── Camera ─────────────────────────────────────────────────────────────────
    cameraBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!isCameraOn) {
        isCameraOn = true;
        ipcRenderer.send('start-overlay', selectedCameraId);
        cameraBtn.classList.add('btn-active');
        // Also open popup to confirm/switch device
        openPopup(cameraPopup, cameraBtn);
      } else {
        openPopup(cameraPopup, cameraBtn);
      }
    });

    // ── Mic ────────────────────────────────────────────────────────────────────
    micBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      openPopup(micPopup, micBtn);
    });

    // ── Shape ──────────────────────────────────────────────────────────────────
    const shapeOrder = ['circle', 'square', 'vertical'];

    shapeBtn.addEventListener('click', () => {
      const idx = shapeOrder.indexOf(currentShape);
      currentShape = shapeOrder[(idx + 1) % shapeOrder.length];
      reIcon(shapeBtn, shapeIconMap[currentShape]);
      ipcRenderer.send('set-shape', currentShape);
    });

    // ── Size ───────────────────────────────────────────────────────────────────
    const sizeOrder = ['S', 'M', 'L'];

    sizeBtn.addEventListener('click', () => {
      const idx = sizeOrder.indexOf(currentSize);
      currentSize = sizeOrder[(idx + 1) % sizeOrder.length];
      sizeBtn.querySelector('.size-label').textContent = currentSize;
      ipcRenderer.send('set-size', currentSize);
    });

    // ── Settings ───────────────────────────────────────────────────────────────
    settingsBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      closeAllPopups();
      ipcRenderer.send('open-settings-window');
    });

    // ── Popup dismiss on outside click ─────────────────────────────────────────
    document.addEventListener('click', (e) => {
      if (activePopup && !e.target.closest('.device-popup') && !e.target.closest('#cameraBtn') && !e.target.closest('#micBtn')) {
        closeAllPopups();
      }
    });

    // ── IPC listeners ──────────────────────────────────────────────────────────
    ipcRenderer.on('recording-status', (_, recording) => {
      if (!recording && isRecording) stopRecording();
    });

    ipcRenderer.on('recording-saved', (_, filePath) => {
      // Optional: could show a brief toast here
    });

    ipcRenderer.on('recording-error', (_, err) => {
      console.error('Recording error:', err);
      if (isRecording) stopRecording();
    });

    ipcRenderer.on('recording-ended-by-user', () => {
      if (isRecording) stopRecording();
    });

    ipcRenderer.on('overlay-status', (_, active) => {
      if (!active) {
        isCameraOn = false;
        cameraBtn.classList.remove('btn-active');
      }
    });

    ipcRenderer.on('save-folder-chosen', (_, folder) => {
      // folder confirmed — no UI update needed in strip
      console.log('Save folder set to:', folder);
    });

    // ── Init ───────────────────────────────────────────────────────────────────
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      loadDevices();
      navigator.mediaDevices.addEventListener('devicechange', loadDevices);
    });
  </script>
</body>
</html>
